# 반스닥 웹 → Cloudflare Workers (OpenNext)
# 저장소 Settings → Secrets and variables → Actions 에 넣을 것
#   Secrets:   CLOUDFLARE_API_TOKEN (Workers 편집 권한), CLOUDFLARE_ACCOUNT_ID, NEIS_KEY
#   Variables: NEXT_PUBLIC_FIREBASE_API_KEY, NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,
#              NEXT_PUBLIC_FIREBASE_PROJECT_ID, NEXT_PUBLIC_FIREBASE_APP_ID  (없으면 "준비 중" 화면으로 배포됨)
name: bansdaq-web

on:
  push:
    branches: [main, claude/zealous-tesla-fqxhmf]
    paths: ["bansdaq/web/**", "bansdaq/functions/src/engine.ts", ".github/workflows/bansdaq-web.yml"]
  workflow_dispatch:

concurrency: bansdaq-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bansdaq/web
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bansdaq/web/package-lock.json
      - run: npm ci
      - name: 토큰 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없습니다"; exit 1
          fi
      - run: npm run cf:deploy
      - name: 나이스 키 등록
        if: ${{ env.NEIS_KEY != '' }}
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
        run: echo "$NEIS_KEY" | npx wrangler secret put NEIS_KEY
