name: keepalive

# GitHub은 60일간 저장소에 활동이 없으면 예약 워크플로를 자동 비활성화한다.
# 주 1회 빈 커밋을 남겨 그걸 막는다.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "ai-company[bot]"
          git config user.email "bot@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive"
          git push
